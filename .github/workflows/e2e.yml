name: E2E & Visual Regression

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: E2E Smoke & Critical Journeys (PR/Push)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_CONTRACT_ID: CMOCKCONTRACTID

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (chromium)
        run: npx playwright test tests/e2e/freelancer-onboarding.spec.ts tests/e2e/full-marketplace-flow.spec.ts --project=chromium --pass-with-no-tests
        continue-on-error: true

      - name: Run E2E tests (chromium-dark)
        run: npx playwright test tests/e2e/freelancer-onboarding.spec.ts tests/e2e/full-marketplace-flow.spec.ts --project=chromium-dark --pass-with-no-tests
        continue-on-error: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-pr-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 30

  nightly-full-suite:
    name: Nightly Full E2E & Visual Regression Suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_CONTRACT_ID: CMOCKCONTRACTID
      CI: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Full E2E & Visual Regression Suite (chromium)
        run: npx playwright test --project=chromium

      - name: Run Full E2E & Visual Regression Suite (chromium-dark)
        run: npx playwright test --project=chromium-dark

      - name: Upload Playwright Report & Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-e2e-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

      - name: File Issue on Nightly Suite Failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const dateStr = new Date().toISOString().split('T')[0];
            const issueTitle = `🚨 Nightly E2E / Visual Regression Suite Failed (${dateStr})`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            // Search existing open issues to avoid duplicate incident reports
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['e2e-failure']
            });
            
            const commentBody = `The nightly E2E and visual regression run failed again on run [${context.runId}](${runUrl}) for commit \`${context.sha}\`.\n\nPlease inspect the uploaded Playwright artifacts.`;
            
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: commentBody
              });
              console.log(`Added failure comment to existing issue #${issues[0].number}`);
            } else {
              const body = `### Nightly E2E & Visual Regression Suite Failure\n\n` +
                `- **Run Date:** ${dateStr}\n` +
                `- **Run Details:** [View Workflow Run](${runUrl})\n` +
                `- **Commit:** \`${context.sha}\`\n` +
                `- **Branch:** \`${context.ref}\`\n\n` +
                `The full scheduled testDir run failed. Visual snapshot diffs, traces, and HTML reports are attached to the run artifacts (retained for 30 days).\n\n` +
                `### Action Required\n` +
                `1. Download \`nightly-e2e-report-${context.runId}\` artifact.\n` +
                `2. Inspect failed specs and visual diffs.\n` +
                `3. If UI intentional change, update baseline snapshots with \`npm run test:visual:update\`.\n` +
                `4. Otherwise, resolve regression.`;
              
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body,
                labels: ['bug', 'e2e-failure', 'automated-test']
              });
              console.log(`Created new failure issue #${newIssue.data.number}`);
            }
